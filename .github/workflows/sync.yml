name: Sync manifests

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - tools/**
      - tests/**

permissions:
  contents: write

concurrency:
  group: sync-manifests
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test synchronization
        run: python3 -m unittest discover -s tests -v
      - name: Fetch manifests and verify release checksums
        run: python3 tools/sync-manifests.py
      - name: Publish manifest updates
        run: |
          git add bucket
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync published app manifests'
          git push
